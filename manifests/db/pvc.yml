# ============================================
# pvc.yml — PersistentVolumeClaim para Postgres
# Solicita 1Gi de almacenamiento persistente
# ============================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: devops-portfolio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
